name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing semver release tag
        required: true
        type: string

jobs:
  release:
    uses: EsionHsrahLatigid/juce-ci/.github/workflows/plugin-release.yml@c14000715ed454a2838f52bd68086f3395931daa
    permissions:
      actions: read
      contents: write
    with:
      product_name: FlacoidCodecCorruptor
      tag_name: ${{ inputs.tag_name || github.ref_name }}
